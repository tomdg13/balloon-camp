name: balloon_camp
description: Balloon Camp Restaurant Ordering App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  provider: ^6.1.1
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  google_fonts: ^6.1.0
  badges: ^3.1.2
  shimmer: ^3.0.0
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/balloon-icon.png"
  adaptive_icon_background: "#fdf6e3"
  adaptive_icon_foreground: "assets/icon/balloon-icon-foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
